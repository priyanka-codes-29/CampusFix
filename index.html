<!DOCTYPE html>
<html>
    <head>
        <tittle>CampusFix</tittle>
    </head>
    <body>
        <h1>CampusFix</h1>
        <p>Report campus problems here, such as issues in lecture rooms, the library, or other college facilities. CampusFix helps students report problems and track their status.</p>
        <label>Issue title</label><br>
        <input type="text"><br>
        <label>Category</label><br>
        <select>
            <option>Electrical</option>
            <option>water</option>
            <option>Furniture</option>
            <option>Cleanliness</option>
            <option>Internet/Wifi</option>
            <option>hostel</option>
            <option>classroom</option>
            <option>security</option>
            <option>other</option>
        </select><br>
        <label>Location</label><br>
        <input type="text"><br>
        <label>Description</label><br>
        <textarea></textarea><br>
        <label>Add a photo(optional)</label><br>
        <input type="file"><br>
        <button style="margin-left: 8px;">Submit report</button>
    </body>
</html>
